*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',system-ui,sans-serif;background:#0e0e10;color:#efeff1;min-height:100vh;display:flex;justify-content:center;align-items:center;overflow:hidden}
.screen{display:none;width:100%;max-width:800px;padding:20px;text-align:center;flex-direction:column;align-items:center}
.screen.active{display:flex}

.logo{font-size:3rem;margin-bottom:4px}
.title{font-size:2.4rem;font-weight:900;background:linear-gradient(135deg,#00b894,#00cec9);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:6px}
.sub{color:#636366;font-size:.95rem;margin-bottom:28px}

.card{background:#18181b;border:2px solid #2a2a2d;border-radius:16px;padding:24px;width:100%;max-width:500px}
.field{margin-bottom:14px;text-align:left}
.field label{display:block;color:#888;font-size:.75rem;margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px}
.field input,.field select{width:100%;padding:11px 14px;border:2px solid #2a2a2d;border-radius:10px;background:#0e0e10;color:#eee;font-size:.95rem;font-family:inherit;outline:none}
.field input:focus{border-color:#00b894}
.field-row{display:flex;gap:10px}
.field-row .field{flex:1}
.opt-row{display:flex;gap:6px;flex-wrap:wrap}
.opt{padding:7px 14px;border:2px solid #2a2a2d;border-radius:8px;background:#0e0e10;color:#888;font-size:.75rem;font-weight:600;font-family:inherit;cursor:pointer;transition:all .2s}
.opt:hover{border-color:#00b894;color:#eee}
.opt.active{border-color:#00b894;background:rgba(0,184,148,.15);color:#00b894}
.btn{padding:13px 28px;border:none;border-radius:12px;font-size:1rem;font-weight:700;font-family:inherit;cursor:pointer;transition:all .2s}
.btn-main{background:linear-gradient(135deg,#00b894,#00cec9);color:#000;width:100%;margin-top:8px}
.btn-main:hover{transform:scale(1.03);box-shadow:0 0 25px rgba(0,184,148,.4)}
.btn-main:disabled{opacity:.4;cursor:not-allowed;transform:none}
.hint{color:#636366;font-size:.78rem;margin-top:16px;line-height:1.6;max-width:420px}

/* lookaway */
.lookaway{position:fixed;inset:0;z-index:200;background:#0e0e10;display:flex;flex-direction:column;align-items:center;justify-content:center}
.lookaway.hidden{display:none}
.lookaway-icon{font-size:6rem;margin-bottom:16px;animation:pulse 1s ease-in-out infinite}
.lookaway-text{font-size:1.8rem;font-weight:900;color:#00b894;margin-bottom:8px}
.lookaway-timer{font-size:4rem;font-weight:900;color:#fff}
.lookaway-word{font-size:3rem;font-weight:900;color:#f9ca24;margin-top:16px;padding:12px 30px;background:rgba(249,202,36,.1);border:3px solid #f9ca24;border-radius:16px}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}

/* game */
.word-display{font-size:2.5rem;font-weight:900;color:#00b894;margin:16px 0;letter-spacing:4px}
.word-hidden{color:#555}
.score-bar{display:flex;justify-content:space-between;width:100%;margin-bottom:12px}
.score-item{font-size:.85rem;color:#888}
.score-item b{color:#00b894}

.chat-area{width:100%;height:280px;background:#18181b;border:2px solid #2a2a2d;border-radius:14px;padding:12px;overflow-y:auto;text-align:left;margin-bottom:14px}
.chat-msg{padding:4px 8px;margin-bottom:2px;border-radius:6px;font-size:.85rem;line-height:1.5;word-break:break-word;animation:fadeIn .3s}
.chat-msg .nick{font-weight:700}

.guess-row{display:flex;gap:10px;width:100%;margin-bottom:10px}
.guess-row input{flex:1;padding:12px 16px;border:2px solid #2a2a2d;border-radius:12px;background:#18181b;color:#eee;font-size:1.1rem;font-family:inherit;outline:none;text-align:center}
.guess-row input:focus{border-color:#00b894}
.btn-guess{padding:12px 24px;background:linear-gradient(135deg,#00b894,#00cec9);color:#000;font-weight:700;border:none;border-radius:12px;font-family:inherit;font-size:1rem;cursor:pointer}
.btn-guess:hover{transform:scale(1.03)}
.btn-giveup{padding:12px 20px;background:rgba(233,69,96,.1);border:2px solid #e94560;color:#e94560;font-weight:700;border-radius:12px;font-family:inherit;font-size:.9rem;cursor:pointer}
.btn-giveup:hover{background:rgba(233,69,96,.2)}

.result-banner{font-size:1.8rem;font-weight:900;margin:16px 0;padding:16px;border-radius:14px}
.result-banner.win{color:#00b894;background:rgba(0,184,148,.1);border:2px solid #00b894}
.result-banner.lose{color:#e94560;background:rgba(233,69,96,.1);border:2px solid #e94560}

.btn-next{margin-top:10px;padding:12px 30px;background:#18181b;border:2px solid #2a2a2d;color:#888;font-weight:700;border-radius:12px;font-family:inherit;font-size:.9rem;cursor:pointer}
.btn-next:hover{border-color:#00b894;color:#eee}

@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

@media(max-width:600px){.title{font-size:1.8rem}.lookaway-word{font-size:2rem}.word-display{font-size:1.8rem}.chat-area{height:200px}}

<body>

<!-- SETUP -->
<div id="screen-setup" class="screen active">
  <div class="logo"><svg width="80" height="80" viewBox="0 0 24 24" fill="#4ade80"><path d="M9 21c0 .55.45 1 1 1h4c.55 0 1-.45 1-1v-1H9v1zm3-19C8.14 2 5 5.14 5 9c0 2.38 1.19 4.47 3 5.74V17c0 .55.45 1 1 1h6c.55 0 1-.45 1-1v-2.26c1.81-1.27 3-3.36 3-5.74 0-3.86-3.14-7-7-7zm2.85 11.1l-.85.6V16h-4v-2.3l-.85-.6A4.997 4.997 0 0 1 7 9c0-2.76 2.24-5 5-5s5 2.24 5 5c0 1.63-.8 3.16-2.15 4.1z"/></svg></div>

<!-- LOOKAWAY -->
<div class="lookaway hidden" id="lookaway">
  <div class="lookaway-icon"><svg width="80" height="80" viewBox="0 0 24 24" fill="#4ade80"><path d="M9 21c0 .55.45 1 1 1h4c.55 0 1-.45 1-1v-1H9v1zm3-19C8.14 2 5 5.14 5 9c0 2.38 1.19 4.47 3 5.74V17c0 .55.45 1 1 1h6c.55 0 1-.45 1-1v-2.26c1.81-1.27 3-3.36 3-5.74 0-3.86-3.14-7-7-7zm2.85 11.1l-.85.6V16h-4v-2.3l-.85-.6A4.997 4.997 0 0 1 7 9c0-2.76 2.24-5 5-5s5 2.24 5 5c0 1.63-.8 3.16-2.15 4.1z"/></svg></div>

  <div class="score-bar">
    <div class="score-item">Раунд <b id="g-round">1</b>/<b id="g-total">5</b></div>

<script>
/* SFX */
const SFX=(function(){
  let ac=null;
  function ctx(){if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();return ac}
  function play(f,t,d,v){try{const c=ctx(),o=c.createOscillator(),g=c.createGain();o.type=t;o.frequency.setValueAtTime(f,c.currentTime);g.gain.setValueAtTime(v||.3,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+d);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+d)}catch(e){}}
  return{
    correct(){play(523,'sine',.1,.3);setTimeout(()=>play(659,'sine',.1,.3),80);setTimeout(()=>play(784,'sine',.2,.3),160)},
    wrong(){play(200,'sawtooth',.2,.2)},
    giveup(){[400,300,200].forEach((f,i)=>setTimeout(()=>play(f,'sawtooth',.2,.2),i*120))},
    tick(){play(600,'sine',.05,.15)},
    reveal(){play(440,'sine',.1,.2);setTimeout(()=>play(660,'sine',.15,.2),100)},
    victory(){[523,659,784,1047].forEach((f,i)=>setTimeout(()=>play(f,'sine',.3,.3),i*120))},
    newMsg(){play(1000,'sine',.03,.08)},
  }
})();

/* words by category */
const WORD_CATS={
  animals:['кошка','собака','кот','медведь','лиса','волк','заяц','орёл','дельфин','акула','лев','тигр','слон','жираф','пингвин','крокодил','обезьяна','попугай','черепаха','хомяк'],
  food:['банан','яблоко','пицца','мороженое','шоколад','кофе','чай','молоко','хлеб','торт','гамбургер','картошка','суши','борщ','пельмени','блины','сосиска','сыр','арбуз','виноград'],
  things:['телефон','компьютер','гитара','пианино','клавиатура','мышка','монитор','наушники','микрофон','камера','принтер','книга','ручка','стол','стул','окно','дверь','лампа','часы','зеркало'],
  nature:['солнце','луна','дерево','огонь','вода','земля','воздух','снег','дождь','радуга','гроза','ветер','облако','гора','море','река','пустыня','вулкан','цветок','лес'],
  transport:['машина','ракета','самолёт','корабль','велосипед','поезд','автобус','вертолёт','лодка','мотоцикл','трамвай','метро','скутер','яхта','такси'],
  sports:['футбол','баскетбол','хоккей','теннис','бокс','плавание','шахматы','скейтборд','волейбол','гольф','сноуборд','лыжи','карате','бег','йога'],
  twitch:['стример','донат','подписчик','модератор','эмоут','чат','фолловер','рейд','бан','клип','хайп','контент','стрим','камера','микрофон'],
  fantasy:['пират','ниндзя','рыцарь','зомби','вампир','робот','инопланетянин','дракон','единорог','эльф','гном','маг','ведьма','призрак','демон'],
  movies:['Титаник','Аватар','Матрица','Шрек','Джокер','Бэтмен','Халк','Тор','Спайдермен','Гарри Поттер','Властелин колец','Терминатор','Пила','Крик','Маска'],
  music:['гитара','барабан','пианино','скрипка','саксофон','флейта','микрофон','наушники','концерт','рок','рэп','джаз','диджей','бит','бас'],
  jobs:['учитель','врач','повар','пожарный','полицейский','космонавт','программист','художник','актёр','музыкант','пилот','водитель','строитель','ветеринар','фермер'],
};
let selectedCat='all';
function getWords(){
  if(selectedCat==='all')return Object.values(WORD_CATS).flat();
  return WORD_CATS[selectedCat]||Object.values(WORD_CATS).flat();
}
const WORDS=Object.values(WORD_CATS).flat(); // fallback

/* state */
let ws=null,wordSrc='builtin',lookawayTime=5,totalRounds=5;
let currentWord='',round=0,score=0,attempts=0,phase='setup';
let chatWord=null,chatWordSetter=null,chatWordPool=[];
let daNetMode=false,twitchChannel='';
function twitchSay(msg){if(ws&&twitchChannel)ws.send('PRIVMSG #'+twitchChannel+' :'+msg)}
function twitchReply(user,msg){twitchSay('@'+user+' '+msg)}
const $=id=>document.getElementById(id);

/* setup */
document.querySelectorAll('#cat-btns .opt').forEach(b=>{
  b.addEventListener('click',()=>{
    document.querySelectorAll('#cat-btns .opt').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    selectedCat=b.dataset.v;
  });
});
document.querySelectorAll('#src-btns .opt').forEach(b=>{
  b.addEventListener('click',()=>{
    document.querySelectorAll('#src-btns .opt').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    wordSrc=b.dataset.v;
  });
});

$('btn-start').addEventListener('click',startGame);
$('s-channel').addEventListener('keydown',e=>{if(e.key==='Enter')startGame()});
$('btn-guess').addEventListener('click',makeGuess);
$('guess-input').addEventListener('keydown',e=>{if(e.key==='Enter')makeGuess()});
$('btn-giveup').addEventListener('click',giveUp);
$('btn-skip').addEventListener('click',nextRound);

function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));$(id).classList.add('active')}
function esc(t){const d=document.createElement('div');d.textContent=t;return d.innerHTML}

/* emotes */
let emoteMap={},roomId=null;
async function load7TVGlobal(){try{const r=await fetch('https://7tv.io/v3/emote-sets/global');const d=await r.json();if(d.emotes)d.emotes.forEach(e=>{emoteMap[e.name]='https://cdn.7tv.app/emote/'+e.id+'/1x.webp'})}catch(e){}}
async function load7TVChannel(id){try{const r=await fetch('https://7tv.io/v3/users/twitch/'+id);const d=await r.json();if(d.emote_set&&d.emote_set.emotes)d.emote_set.emotes.forEach(e=>{emoteMap[e.name]='https://cdn.7tv.app/emote/'+e.id+'/1x.webp'})}catch(e){}}
async function loadBTTVGlobal(){try{const r=await fetch('https://api.betterttv.net/3/cached/emotes/global');const d=await r.json();d.forEach(e=>{emoteMap[e.code]='https://cdn.betterttv.net/emote/'+e.id+'/1x'})}catch(e){}}
async function loadBTTVChannel(id){try{const r=await fetch('https://api.betterttv.net/3/cached/users/twitch/'+id);const d=await r.json();(d.channelEmotes||[]).concat(d.sharedEmotes||[]).forEach(e=>{emoteMap[e.code]='https://cdn.betterttv.net/emote/'+e.id+'/1x'})}catch(e){}}
async function loadFFZChannel(id){try{const r=await fetch('https://api.frankerfacez.com/v1/room/id/'+id);const d=await r.json();Object.values(d.sets||{}).forEach(s=>{(s.emoticons||[]).forEach(e=>{emoteMap[e.name]=e.urls['1']||e.urls['2']})})}catch(e){}}
function renderEmotes(text){return text.split(' ').map(w=>{if(emoteMap[w])return'<img src="'+emoteMap[w]+'" style="height:1.6em;vertical-align:middle;margin:-2px 2px" alt="'+esc(w)+'">';return esc(w)}).join(' ')}

function startGame(){
  const ch=$('s-channel').value.trim().toLowerCase().replace(/^#/,'');
  if(wordSrc==='chat'&&!ch){alert('Введи канал для режима "Чат предлагает"');return}
  lookawayTime=parseInt($('s-lookaway').value)||3;
  totalRounds=parseInt($('s-rounds').value)||5;
  round=0;score=0;attempts=0;phase='playing';chatWord=null;
  $('g-total').textContent=totalRounds;
  if(ch){
    load7TVGlobal();loadBTTVGlobal();
    connectChat(ch);
  }
  nextRound();
}

/* IRC */
function connectChat(ch){
  if(ws){ws.close();ws=null}
  const BOT_OAUTH='oauth:k1yo3m9jhf89h5fasdu16c5pzkety5';
  const BOT_NICK='ishakgetsbanned';
  twitchChannel=ch;
  try{ws=new WebSocket('wss://irc-ws.chat.twitch.tv:443')}catch{return}
  ws.onopen=()=>{
    ws.send('CAP REQ :twitch.tv/tags');
    ws.send('PASS '+BOT_OAUTH);
    ws.send('NICK '+BOT_NICK);
    ws.send('JOIN #'+ch);
  };
  ws.onmessage=ev=>{
    for(const line of ev.data.trim().split('\r\n')){
      if(line.startsWith('PING')){ws.send('PONG :tmi.twitch.tv');continue}
      if(line.includes('ROOMSTATE')&&!roomId){const m=line.match(/room-id=(\d+)/);if(m){roomId=m[1];load7TVChannel(roomId);loadBTTVChannel(roomId);loadFFZChannel(roomId)}}
      if(line.includes('PRIVMSG')){
        const msg=parseMsg(line);
        if(msg) handleMsg(msg);
      }
    }
  };
}

function parseMsg(line){
  let tags={},rest=line;
  if(line.startsWith('@')){const sp=line.indexOf(' ');line.substring(1,sp).split(';').forEach(t=>{const p=t.indexOf('=');if(p>0)tags[t.substring(0,p)]=t.substring(p+1)});rest=line.substring(sp+1)}
  const pi=rest.indexOf('PRIVMSG');if(pi===-1)return null;
  const ci=rest.indexOf(' :',pi);if(ci===-1)return null;
  const text=rest.substring(ci+2).trim();if(!text)return null;
  return{username:tags['display-name']||'Anon',color:tags['color']||'#00b894',text};
}

function handleMsg(msg){
  if(msg.username.toLowerCase()==='ishakgetsbanned')return;
  const txt=msg.text.trim().toLowerCase();

  /* chat suggests word — collect for 10 seconds */
  if(wordSrc==='chat'&&phase==='collecting_words'&&txt.startsWith('!word ')){
    const word=msg.text.trim().substring(6).trim();
    if(word){
      chatWordPool.push({word,by:msg.username});
      $('word-display').textContent='Собираем слова: '+chatWordPool.length+'...';
      twitchReply(msg.username,'слово принято! ✅ ('+chatWordPool.length+' всего)');
    }
    return;
  }

  /* mod command: !danetchat on/off */
  if(txt==='!danetchat on'){daNetMode=true;addSystemMsg('<svg width="14" height="14" viewBox="0 0 24 24" fill="#22c55e" style="vertical-align:middle"><circle cx="12" cy="12" r="10"/></svg> Режим ДА/НЕТ включён');return}
  if(txt==='!danetchat off'){daNetMode=false;addSystemMsg('<svg width="14" height="14" viewBox="0 0 24 24" fill="#ef4444" style="vertical-align:middle"><circle cx="12" cy="12" r="10"/></svg> Режим ДА/НЕТ выключен');return}

  /* filter messages */
  if(phase==='guessing'&&currentWord){
    if(txt.includes(currentWord.toLowerCase())){return}
    if(daNetMode){
      const clean=txt.replace(/[^а-яёa-z]/gi,'').toLowerCase();
      if(clean!=='да'&&clean!=='нет'&&clean!=='yes'&&clean!=='no')return;
    }
    addChatMsg(msg);
  }
}

function addChatMsg(msg){
  const area=$('chat-area');
  const d=document.createElement('div');
  d.className='chat-msg';
  d.innerHTML='<span class="nick" style="color:'+msg.color+'">'+esc(msg.username)+'</span>: '+renderEmotes(msg.text);
  area.appendChild(d);
  area.scrollTop=area.scrollHeight;
  SFX.newMsg();
}

/* rounds */
function nextRound(){
  round++;
  if(round>totalRounds){endGame();return}

  $('g-round').textContent=round;
  $('g-score').textContent=score;
  $('g-attempts').textContent=0;
  $('chat-area').innerHTML='';
  $('guess-input').value='';
  $('result-banner').style.display='none';
  $('btn-skip').style.display='none';
  $('btn-giveup').style.display='';
  $('btn-guess').disabled=false;
  $('guess-input').disabled=false;

  if(wordSrc==='chat'){
    phase='collecting_words';
    chatWordPool=[];
    $('word-display').textContent='Собираем слова: 0...';
    showScreen('screen-game');
    addSystemMsg('Чат, пишите !word <слово> — 10 секунд на предложения!');
    let left=10;
    const iv=setInterval(()=>{
      left--;
      addSystemMsg('⏳ '+left+' сек...');
      if(left<=0){
        clearInterval(iv);
        if(chatWordPool.length===0){
          addSystemMsg('<svg width="14" height="14" viewBox="0 0 24 24" fill="#ef4444" style="vertical-align:middle"><path d="M12 2C6.47 2 2 6.47 2 12s4.47 10 10 10 10-4.47 10-10S17.53 2 12 2zm5 13.59L15.59 17 12 13.41 8.41 17 7 15.59 10.59 12 7 8.41 8.41 7 12 10.59 15.59 7 17 8.41 13.41 12 17 15.59z"/></svg> Никто не предложил слово! Берём из встроенных.');
          const pool=getWords();
          currentWord=pool[Math.floor(Math.random()*pool.length)];
        }else{
          const pick=chatWordPool[Math.floor(Math.random()*chatWordPool.length)];
          currentWord=pick.word;
          chatWordSetter=pick.by;
          addSystemMsg('<svg width="14" height="14" viewBox="0 0 24 24" fill="#22c55e" style="vertical-align:middle"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg> Выбрано слово от '+pick.by+'!');
        }
        startLookaway();
      }
    },1000);
  }else{
    const pool=getWords();
    currentWord=pool[Math.floor(Math.random()*pool.length)];
    startLookaway();
  }
}

function startLookaway(){
  if(wordSrc==='chat'&&chatWord) currentWord=chatWord;
  chatWord=null;

  const la=$('lookaway');
  la.classList.remove('hidden');
  $('la-word').style.display='none';
  $('la-word').textContent=currentWord.toUpperCase();
  $('lookaway-text').textContent='СТРИМЕР, ОТВЕРНИСЬ!';
  $('la-timer').textContent='2';

  /* phase 1: "отвернись" — 2 секунды */
  let left=2;
  const iv=setInterval(()=>{
    left--;
    SFX.tick();
    $('la-timer').textContent=left;
    if(left<=0){
      clearInterval(iv);
      /* phase 2: показать слово чату на lookawayTime секунд */
      $('la-word').style.display='';
      $('lookaway-text').textContent='ЧАТ, ЗАПОМНИТЕ!';
      $('la-timer').textContent=lookawayTime;
      SFX.reveal();
      let wordLeft=lookawayTime;
      const iv2=setInterval(()=>{
        wordLeft--;
        $('la-timer').textContent=wordLeft;
        if(wordLeft<=0){
          clearInterval(iv2);
          /* TTS: поворачивайся */
          try{const u=new SpeechSynthesisUtterance('Поворачивайся!');u.lang='ru-RU';u.rate=1.1;u.volume=1;speechSynthesis.speak(u)}catch(e){}
          SFX.reveal();
          la.classList.add('hidden');
          phase='guessing';
          attempts=0;
          $('word-display').textContent=currentWord.replace(/./g,'_ ').trim();
          showScreen('screen-game');
          addSystemMsg('Чат, описывайте слово! Не называйте его!');
          $('guess-input').focus();
        }
      },1000);
    }
  },1000);
}

function addSystemMsg(text){
  const area=$('chat-area');
  const d=document.createElement('div');
  d.className='chat-msg';
  d.innerHTML='<span class="nick" style="color:#f9ca24"><svg width="14" height="14" viewBox="0 0 24 24" fill="#f9ca24" style="vertical-align:middle"><path d="M7 2v11h3v9l7-12h-4l4-8z"/></svg> Система</span>: '+text;
  area.appendChild(d);
}

/* guess */
function makeGuess(){
  if(phase!=='guessing')return;
  const guess=$('guess-input').value.trim();
  if(!guess)return;
  attempts++;
  $('g-attempts').textContent=attempts;
  $('guess-input').value='';

  if(guess.toLowerCase()===currentWord.toLowerCase()){
    /* correct! */
    phase='revealed';
    score++;
    $('g-score').textContent=score;
    $('word-display').textContent=currentWord.toUpperCase();
    $('result-banner').innerHTML='<svg width="20" height="20" viewBox="0 0 24 24" fill="#22c55e" style="vertical-align:middle"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg> Правильно! Слово: '+currentWord;
    $('result-banner').className='result-banner win';
    $('result-banner').style.display='';
    $('btn-giveup').style.display='none';
    $('btn-skip').style.display='';
    $('btn-guess').disabled=true;
    $('guess-input').disabled=true;
    SFX.correct();
    twitchSay('✅ Стример угадал! Слово: '+currentWord+' (попыток: '+attempts+') 🎉');
  }else{
    SFX.wrong();
    $('guess-input').placeholder='Неверно! Попробуй ещё...';
    setTimeout(()=>{$('guess-input').placeholder='Твоя догадка...'},1500);
  }
}

function giveUp(){
  if(phase!=='guessing')return;
  phase='revealed';
  $('word-display').textContent=currentWord.toUpperCase();
  $('result-banner').innerHTML='<svg width="20" height="20" viewBox="0 0 24 24" fill="#ef4444" style="vertical-align:middle"><path d="M12 2C6.47 2 2 6.47 2 12s4.47 10 10 10 10-4.47 10-10S17.53 2 12 2zm5 13.59L15.59 17 12 13.41 8.41 17 7 15.59 10.59 12 7 8.41 8.41 7 12 10.59 15.59 7 17 8.41 13.41 12 17 15.59z"/></svg> Слово было: '+currentWord;
  $('result-banner').className='result-banner lose';
  $('result-banner').style.display='';
  $('btn-giveup').style.display='none';
  $('btn-skip').style.display='';
  $('btn-guess').disabled=true;
  $('guess-input').disabled=true;
  SFX.giveup();
  twitchSay('❌ Стример сдался! Слово было: '+currentWord+' 😅');
}

function endGame(){
  if(ws){ws.close();ws=null}
  $('over-stats').innerHTML=
    'Раундов: '+totalRounds+'<br>'+
    'Угадано: <b style="color:#00b894">'+score+'</b> из '+totalRounds+'<br>'+
    'Всего попыток: '+attempts;
  showScreen('screen-over');
  if(score>=totalRounds*0.6) SFX.victory(); else SFX.giveup();
}
</script>
