<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DomikBot – Guess Word</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
    font-family: 'Poppins', sans-serif;
    background: #0d0b1a;
    color: #e0e0e0;
    min-height: 100vh;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
}
.container { max-width: 750px; width: 100%; }
.header { text-align: center; margin-bottom: 30px; }
.header h1 { font-size: 2.2rem; font-weight: 900; background: linear-gradient(to right, #fff, #a1a1aa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.header p { color: #888; font-size: 0.95rem; }
.card {
    background: rgba(20,20,23,0.85);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 20px;
    padding: 30px;
    margin-bottom: 20px;
}
.field { margin-bottom: 16px; }
.field label { display: block; color: #888; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 5px; }
.field input, .field select { width: 100%; padding: 12px 16px; background: #18181b; border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; color: #fff; font-size: 1rem; font-family: inherit; outline: none; }
.field input:focus, .field select:focus { border-color: #9146FF; }
.row { display: flex; gap: 15px; flex-wrap: wrap; }
.row .field { flex: 1; min-width: 120px; }
.btn-primary {
    background: linear-gradient(135deg, #9146FF, #7c3aed);
    color: white;
    border: none;
    padding: 14px 28px;
    border-radius: 12px;
    font-weight: 700;
    font-size: 1rem;
    cursor: pointer;
    transition: all 0.3s;
    width: 100%;
}
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(145,70,255,0.5); }
.btn-secondary {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
    color: #e0e0e0;
    padding: 12px 24px;
    border-radius: 12px;
    font-weight: 600;
    cursor: pointer;
}
.btn-secondary:hover { background: rgba(255,255,255,0.1); }
.hidden { display: none !important; }
.score-bar { display: flex; justify-content: space-between; font-size: 0.9rem; color: #a1a1aa; margin-bottom: 10px; }
.score-bar b { color: #fff; }
.word-display { font-size: 2.2rem; font-weight: 700; text-align: center; letter-spacing: 6px; padding: 15px 0; }
.chat-area { max-height: 200px; overflow-y: auto; background: rgba(255,255,255,0.02); padding: 10px; border-radius: 12px; margin: 10px 0; }
.chat-msg { padding: 4px 8px; font-size: 0.9rem; }
.chat-msg .user { color: #9146FF; font-weight: 600; }
.guess-row { display: flex; gap: 10px; margin: 10px 0; }
.guess-row input { flex: 1; padding: 12px 16px; background: #18181b; border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; color: #fff; font-size: 1rem; font-family: inherit; outline: none; }
.guess-row input:focus { border-color: #9146FF; }
.guess-row .btn-primary { width: auto; padding: 12px 24px; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; }
.actions .btn-secondary { flex: 1; }
.result-banner { font-size: 1.4rem; font-weight: 700; padding: 12px; border-radius: 12px; text-align: center; margin: 10px 0; display: none; }
.result-banner.win { background: rgba(34,197,94,0.1); border: 2px solid #22c55e; color: #22c55e; }
.result-banner.lose { background: rgba(239,68,68,0.1); border: 2px solid #ef4444; color: #ef4444; }
.finish-title { font-size: 2.5rem; font-weight: 800; text-align: center; margin: 20px 0; }
.finish-stats { text-align: center; font-size: 1.2rem; color: #a1a1aa; line-height: 2; }
.footer {
    position: fixed;
    bottom: 20px;
    left: 20px;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
}
.btn-reload {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 20px;
    padding: 8px 16px;
    font-size: 0.78rem;
    color: #a1a1aa;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
}
.btn-reload:hover { background: rgba(255,255,255,0.08); color: #fff; }
.btn-donate {
    background: #9146FF;
    color: white;
    border: none;
    border-radius: 20px;
    padding: 8px 16px;
    font-size: 0.78rem;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
}
.btn-donate:hover { opacity: 0.9; }
.lookaway {
    position: fixed;
    inset: 0;
    background: #0d0b1a;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 200;
}
.lookaway.hidden { display: none; }
.lookaway .text { font-size: 2.5rem; font-weight: 800; color: #9146FF; }
.lookaway .timer { font-size: 4rem; font-weight: 900; color: #fff; margin: 10px 0; }
.lookaway .word { font-size: 3.5rem; font-weight: 900; color: #f5a623; margin-top: 20px; }
@media (max-width: 600px) {
    .lookaway .word { font-size: 2.5rem; }
    .word-display { font-size: 1.8rem; }
}
</style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>💡 Guess Word</h1>
        <p>Чат описывает слово — стример угадывает!</p>
    </div>

    <!-- SETUP -->
    <div id="setup-screen" class="card">
        <div class="field"><label>Twitch канал</label><input type="text" id="channel-input" value="domik_xdx"></div>
        <div class="field"><label>Источник слов</label>
            <select id="source-select"><option value="builtin">Встроенные</option><option value="chat">Чат предлагает</option></select>
        </div>
        <div class="field"><label>Категория</label>
            <select id="category-select">
                <option value="all">Все</option>
                <option value="animals">Животные</option>
                <option value="food">Еда</option>
                <option value="things">Предметы</option>
                <option value="nature">Природа</option>
                <option value="transport">Транспорт</option>
                <option value="sports">Спорт</option>
                <option value="twitch">Twitch</option>
                <option value="fantasy">Фэнтези</option>
                <option value="movies">Фильмы</option>
                <option value="music">Музыка</option>
                <option value="jobs">Профессии</option>
            </select>
        </div>
        <div class="row">
            <div class="field"><label>Время показа (сек)</label><input type="number" id="show-time" value="3" min="1"></div>
            <div class="field"><label>Раундов</label><input type="number" id="rounds" value="5" min="1"></div>
        </div>
        <button class="btn-primary" onclick="startGame()">Начать игру</button>
        <div style="font-size:0.8rem;color:#a1a1aa;margin-top:10px;text-align:center;">Стример отворачивается — чату показывают слово. Чат описывает, не называя.</div>
    </div>

    <!-- LOOKAWAY -->
    <div class="lookaway hidden" id="lookaway">
        <div class="text" id="lookaway-text">СТРИМЕР, ОТВЕРНИСЬ!</div>
        <div class="timer" id="lookaway-timer">3</div>
        <div class="word" id="lookaway-word" style="display:none">СЛОВО</div>
    </div>

    <!-- GAME -->
    <div id="game-screen" class="card hidden">
        <div class="score-bar">
            <span>Раунд <b id="g-round">1</b>/<b id="g-total">5</b></span>
            <span>Очки: <b id="g-score">0</b></span>
            <span>Попыток: <b id="g-attempts">0</b></span>
        </div>
        <div class="word-display" id="word-display">_ _ _ _ _</div>
        <div class="chat-area" id="chat-area"></div>
        <div class="guess-row">
            <input type="text" id="guess-input" placeholder="Твоя догадка...">
            <button class="btn-primary" onclick="makeGuess()">Угадать</button>
        </div>
        <div class="actions">
            <button class="btn-secondary" id="btn-giveup" onclick="giveUp()">Сдаюсь</button>
            <button class="btn-secondary" id="btn-next" onclick="nextRound()" style="display:none;">Следующее слово →</button>
        </div>
        <div class="result-banner" id="result-banner"></div>
    </div>

    <!-- FINISH -->
    <div id="finish-screen" class="card hidden">
        <div class="finish-title">🏁 РЕЗУЛЬТАТЫ</div>
        <div class="finish-stats" id="finish-stats"></div>
        <button class="btn-primary" onclick="location.reload()">Играть снова</button>
    </div>
</div>

<div class="footer">
    <button class="btn-reload" onclick="window.location.reload()">🔄 если залагало — нажми</button>
    <button class="btn-donate" onclick="openDonate()">💜 Поддержать домика <span id="footer-nick">@domik_xdx</span></button>
</div>

<script>
const BACKEND_URL = 'https://domikbot-12-production.up.railway.app';
const DONATE_URL = 'https://www.donationalerts.com/r/xxx_domik_xxx';
const socket = io(BACKEND_URL);
let currentUser = 'domik_xdx';
let currentWord = '', round = 0, totalRounds = 5, score = 0, attempts = 0, phase = 'idle';
let wordSrc = 'builtin', category = 'all', showTime = 3;

function initUser() {
    const params = new URLSearchParams(window.location.search);
    const user = params.get('channel') || 'domik_xdx';
    currentUser = user;
    document.getElementById('footer-nick').textContent = '@' + currentUser;
    document.getElementById('channel-input').value = currentUser;
    const token = localStorage.getItem('domik_bot_token');
    if (token) socket.emit('auth', { channel: currentUser, token });
}
initUser();

socket.on('connect', () => {
    socket.emit('get_guess_state', { channel: currentUser });
    const token = localStorage.getItem('domik_bot_token');
    if (token) socket.emit('auth', { channel: currentUser, token });
});

socket.on('guess_word_show', (data) => {
    if (data.channel !== currentUser) return;
    showLookaway(data.word, data.time, data.round, data.total);
});

socket.on('guess_word_playing', (data) => {
    if (data.channel !== currentUser) return;
    document.getElementById('lookaway').classList.add('hidden');
    document.getElementById('game-screen').classList.remove('hidden');
    document.getElementById('g-round').textContent = data.round;
    document.getElementById('g-total').textContent = data.total;
    document.getElementById('g-score').textContent = data.score;
    document.getElementById('g-attempts').textContent = data.attempts;
    document.getElementById('word-display').textContent = currentWord ? currentWord.replace(/./g,'_ ').trim() : '_ _ _ _ _';
    document.getElementById('btn-next').style.display = 'none';
    document.getElementById('btn-giveup').style.display = '';
    document.getElementById('guess-input').disabled = false;
    document.getElementById('guess-input').value = '';
    document.getElementById('guess-input').focus();
    document.getElementById('result-banner').style.display = 'none';
    document.getElementById('result-banner').className = 'result-banner';
    phase = 'playing';
});

socket.on('guess_correct', (data) => {
    if (data.channel !== currentUser) return;
    document.getElementById('g-score').textContent = data.score;
    document.getElementById('word-display').textContent = data.word.toUpperCase();
    document.getElementById('btn-next').style.display = '';
    document.getElementById('btn-giveup').style.display = 'none';
    document.getElementById('guess-input').disabled = true;
    const banner = document.getElementById('result-banner');
    banner.innerHTML = '✅ Правильно! Слово: ' + data.word;
    banner.className = 'result-banner win';
    banner.style.display = '';
    phase = 'revealed';
});

socket.on('guess_wrong', (data) => {
    if (data.channel !== currentUser) return;
    document.getElementById('g-attempts').textContent = data.attempts;
    if (data.attempts >= data.maxAttempts) {
        document.getElementById('btn-next').style.display = '';
        document.getElementById('btn-giveup').style.display = 'none';
        document.getElementById('guess-input').disabled = true;
    } else {
        document.getElementById('guess-input').value = '';
        document.getElementById('guess-input').focus();
    }
});

socket.on('guess_finished', (data) => {
    if (data.channel !== currentUser) return;
    document.getElementById('game-screen').classList.add('hidden');
    document.getElementById('finish-screen').classList.remove('hidden');
    document.getElementById('finish-stats').innerHTML =
        'Раундов: ' + data.total + '<br>' +
        'Угадано: <b style="color:#22c55e">' + data.score + '</b> из ' + data.total + '<br>' +
        'Всего попыток: ' + document.getElementById('g-attempts').textContent;
});

socket.on('guess_cancelled', (data) => {
    if (data.channel !== currentUser) return;
    document.getElementById('setup-screen').classList.remove('hidden');
    document.getElementById('game-screen').classList.add('hidden');
    document.getElementById('finish-screen').classList.add('hidden');
    document.getElementById('lookaway').classList.add('hidden');
});

socket.on('guess_error', (msg) => alert('Ошибка: ' + msg));

function startGame() {
    const ch = document.getElementById('channel-input').value.trim().toLowerCase();
    if (!ch) { alert('Введите канал!'); return; }
    currentUser = ch;
    wordSrc = document.getElementById('source-select').value;
    category = document.getElementById('category-select').value;
    showTime = parseInt(document.getElementById('show-time').value) || 3;
    totalRounds = parseInt(document.getElementById('rounds').value) || 5;
    document.getElementById('g-total').textContent = totalRounds;
    document.getElementById('setup-screen').classList.add('hidden');
    socket.emit('guess_start', { channel: currentUser, category, rounds: totalRounds, showTime });
}

function showLookaway(word, time, round, total) {
    document.getElementById('lookaway').classList.remove('hidden');
    document.getElementById('lookaway-word').style.display = 'none';
    document.getElementById('lookaway-text').textContent = 'СТРИМЕР, ОТВЕРНИСЬ!';
    document.getElementById('lookaway-timer').textContent = '2';
    currentWord = word;
    let left = 2;
    const iv = setInterval(() => {
        left--;
        document.getElementById('lookaway-timer').textContent = left;
        if (left <= 0) {
            clearInterval(iv);
            document.getElementById('lookaway-word').textContent = word.toUpperCase();
            document.getElementById('lookaway-word').style.display = '';
            document.getElementById('lookaway-text').textContent = 'ЧАТ, ЗАПОМНИТЕ!';
            document.getElementById('lookaway-timer').textContent = time;
            let wordLeft = time;
            const iv2 = setInterval(() => {
                wordLeft--;
                document.getElementById('lookaway-timer').textContent = wordLeft;
                if (wordLeft <= 0) {
                    clearInterval(iv2);
                    try { const u = new SpeechSynthesisUtterance('Поворачивайся!'); u.lang='ru-RU'; u.rate=1.1; speechSynthesis.speak(u); } catch(e) {}
                    document.getElementById('lookaway').classList.add('hidden');
                    document.getElementById('game-screen').classList.remove('hidden');
                    document.getElementById('g-round').textContent = round;
                    document.getElementById('g-total').textContent = total;
                    document.getElementById('word-display').textContent = word.replace(/./g,'_ ').trim();
                    document.getElementById('btn-next').style.display = 'none';
                    document.getElementById('btn-giveup').style.display = '';
                    document.getElementById('guess-input').disabled = false;
                    document.getElementById('guess-input').value = '';
                    document.getElementById('guess-input').focus();
                    document.getElementById('result-banner').style.display = 'none';
                    document.getElementById('result-banner').className = 'result-banner';
                    phase = 'playing';
                }
            }, 1000);
        }
    }, 1000);
}

function makeGuess() {
    if (phase !== 'playing') return;
    const guess = document.getElementById('guess-input').value.trim();
    if (!guess) return;
    socket.emit('guess_attempt', { channel: currentUser, guess });
    document.getElementById('guess-input').value = '';
}

function giveUp() {
    if (phase !== 'playing') return;
    if (confirm('Сдаться?')) {
        socket.emit('guess_giveup', { channel: currentUser });
        document.getElementById('btn-giveup').style.display = 'none';
        document.getElementById('guess-input').disabled = true;
    }
}

function nextRound() {
    if (phase === 'revealed' || phase === 'playing') {
        socket.emit('guess_next', { channel: currentUser });
        document.getElementById('btn-next').style.display = 'none';
    }
}

function openDonate() { window.open(DONATE_URL, '_blank'); }

socket.on('chatMessage', (data) => {
    if (data.channel !== currentUser) return;
    const gameScreen = document.getElementById('game-screen');
    if (gameScreen.classList.contains('hidden')) return;
    const area = document.getElementById('chat-area');
    const div = document.createElement('div');
    div.className = 'chat-msg';
    div.innerHTML = `<span class="user">${escapeHTML(data.user)}:</span> ${escapeHTML(data.message)}`;
    area.appendChild(div);
    area.scrollTop = area.scrollHeight;
    if (area.children.length > 50) area.removeChild(area.firstChild);
});

function escapeHTML(str) { const div = document.createElement('div'); div.textContent = str; return div.innerHTML; }

socket.on('connect_error', (err) => {
    console.error('Ошибка подключения к серверу:', err);
    alert('Не удалось подключиться к серверу. Проверьте, запущен ли сервер.');
});
</script>
</body>
</html>
