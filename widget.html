<style>
* { margin:0; padding:0; box-sizing:border-box; }

:root {
    --accent: #9146FF;
    --accent-dim: rgba(145,70,255,0.15);
    --accent-glow: rgba(145,70,255,0.35);
    --bg: #0c0c0e;
    --bg-card: rgba(22,22,26,0.95);
    --border: rgba(255,255,255,0.08);
    --text: #ffffff;
    --text-muted: #71717a;
    --success: #22c55e;
    --success-dim: rgba(34,197,94,0.15);
    --danger: #ef4444;
    --danger-dim: rgba(239,68,68,0.12);
    --radius: 16px;
    --transition: all 0.3s cubic-bezier(.4,0,.2,1);
}

body {
    font-family: 'Poppins', sans-serif;
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 12px;
}

.widget {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px 22px;
    width: 100%;
    max-width: 320px;
    backdrop-filter: blur(20px);
    box-shadow: 0 8px 32px rgba(0,0,0,0.5), 0 0 0 1px rgba(145,70,255,0.06);
    position: relative;
    overflow: hidden;
}

.widget::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    opacity: 0;
    transition: var(--transition);
}
.widget.active::before { opacity: 1; }

/* Header */
.header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 16px;
}
.logo {
    width: 34px; height: 34px;
    background: var(--accent);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
    box-shadow: 0 4px 12px var(--accent-glow);
}
.header-text { flex: 1; min-width: 0; }
.bot-name {
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--text);
    letter-spacing: 0.3px;
}
.channel-name {
    font-size: 0.72rem;
    color: var(--accent);
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

/* Status pill */
.status-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    margin-bottom: 14px;
}
.status-left { display: flex; align-items: center; gap: 8px; }
.dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--text-muted);
    flex-shrink: 0;
    transition: var(--transition);
}
.dot.online {
    background: var(--success);
    box-shadow: 0 0 8px var(--success);
    animation: pulse 2s infinite;
}
.dot.connecting {
    background: #f59e0b;
    animation: blink 1s infinite;
}
@keyframes pulse {
    0%,100% { box-shadow: 0 0 6px var(--success); }
    50%      { box-shadow: 0 0 14px var(--success); }
}
@keyframes blink {
    0%,100% { opacity: 1; }
    50%      { opacity: 0.3; }
}
.status-label {
    font-size: 0.78rem;
    font-weight: 600;
    color: var(--text-muted);
    transition: var(--transition);
}
.status-label.online { color: var(--success); }
.status-label.connecting { color: #f59e0b; }

/* Toggle */
.toggle-wrap { display: flex; align-items: center; gap: 6px; }
.toggle-hint { font-size: 0.65rem; color: var(--text-muted); }
.toggle {
    position: relative;
    width: 42px; height: 24px;
    cursor: pointer;
}
.toggle input { opacity: 0; width: 0; height: 0; }
.slider {
    position: absolute; inset: 0;
    background: rgba(255,255,255,0.1);
    border-radius: 24px;
    border: 1px solid rgba(255,255,255,0.12);
    transition: var(--transition);
}
.slider::before {
    content: '';
    position: absolute;
    left: 3px; top: 3px;
    width: 16px; height: 16px;
    background: #fff;
    border-radius: 50%;
    transition: var(--transition);
    box-shadow: 0 1px 4px rgba(0,0,0,0.4);
}
.toggle input:checked + .slider {
    background: var(--accent);
    border-color: var(--accent);
    box-shadow: 0 0 10px var(--accent-glow);
}
.toggle input:checked + .slider::before { transform: translateX(18px); }
.toggle input:disabled + .slider { opacity: 0.4; cursor: not-allowed; }

/* Stats row */
.stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 14px;
}
.stat-card {
    background: rgba(255,255,255,0.02);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px 12px;
    text-align: center;
}
.stat-value { font-size: 1.1rem; font-weight: 800; color: var(--text); }
.stat-value.accent { color: var(--accent); }
.stat-label { font-size: 0.62rem; color: var(--text-muted); margin-top: 1px; }

/* Chat preview */
.chat-title {
    font-size: 0.68rem;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin-bottom: 6px;
}
.chat-feed {
    background: rgba(0,0,0,0.25);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px 10px;
    height: 90px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 4px;
    scrollbar-width: thin;
    scrollbar-color: rgba(255,255,255,0.1) transparent;
}
.chat-feed::-webkit-scrollbar { width: 3px; }
.chat-feed::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }
.chat-msg {
    font-size: 0.72rem;
    line-height: 1.35;
    color: var(--text-muted);
    word-break: break-word;
    animation: fadeIn 0.2s ease;
}
.chat-msg .nick { color: var(--accent); font-weight: 600; margin-right: 4px; }
.chat-empty {
    flex: 1; display: flex; align-items: center; justify-content: center;
    font-size: 0.7rem; color: rgba(255,255,255,0.15); text-align: center;
}
@keyframes fadeIn { from { opacity:0; transform:translateY(4px); } to { opacity:1; transform:none; } }

/* Footer */
.footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 12px;
    padding-top: 10px;
    border-top: 1px solid var(--border);
}
.powered {
    font-size: 0.6rem;
    color: rgba(255,255,255,0.18);
    font-weight: 500;
}
.powered span { color: var(--accent); font-weight: 700; }
.ws-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--text-muted);
    transition: var(--transition);
}
.ws-dot.connected { background: var(--success); }

/* Error state */
.error-msg {
    display: none;
    text-align: center;
    padding: 20px 10px;
    font-size: 0.78rem;
    color: var(--danger);
}
</style>
</head>
<body>

<div class="widget" id="widget">
    <div id="error-view" class="error-msg">
        ⚠️ Укажите канал:<br>
        <code style="font-size:0.7rem;color:#a1a1aa">?channel=ваш_ник</code>
    </div>

    <div id="main-view">
        <!-- Header -->
        <div class="header">
            <div class="logo">🤖</div>
            <div class="header-text">
                <div class="bot-name">DomikBot</div>
                <div class="channel-name" id="channel-label">@...</div>
            </div>
        </div>

        <!-- Status + toggle -->
        <div class="status-row">
            <div class="status-left">
                <div class="dot connecting" id="status-dot"></div>
                <div class="status-label connecting" id="status-label">Подключение...</div>
            </div>
            <div class="toggle-wrap">
                <span class="toggle-hint" id="toggle-hint">вкл</span>
                <label class="toggle">
                    <input type="checkbox" id="bot-toggle" disabled>
                    <span class="slider"></span>
                </label>
            </div>
        </div>

        <!-- Stats -->
        <div class="stats">
            <div class="stat-card">
                <div class="stat-value accent" id="msg-count">0</div>
                <div class="stat-label">сообщений</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="uptime-label">—</div>
                <div class="stat-label">онлайн</div>
            </div>
        </div>

        <!-- Chat preview -->
        <div class="chat-title">💬 Чат канала</div>
        <div class="chat-feed" id="chat-feed">
            <div class="chat-empty" id="chat-empty">Ожидание сообщений...</div>
        </div>

        <!-- Footer -->
        <div class="footer">
            <div class="powered">работает на <span>DomikBot</span></div>
            <div class="ws-dot" id="ws-dot"></div>
        </div>
    </div>
</div>

<script>
const params = new URLSearchParams(location.search);
const CHANNEL = (params.get('channel') || '').toLowerCase().trim();
const BACKEND_URL = window.location.origin;

if (!CHANNEL) {
    document.getElementById('main-view').style.display = 'none';
    document.getElementById('error-view').style.display = 'block';
} else {
    init();
}

function init() {
    document.getElementById('channel-label').textContent = '@' + CHANNEL;

    let msgCount = 0;
    let connectedAt = null;
    let uptimeTimer = null;
    let isTogglingBot = false; // ✅ НОВОЕ: флаг для предотвращения множественных toggle событий

    const toggle    = document.getElementById('bot-toggle');
    const dot       = document.getElementById('status-dot');
    const label     = document.getElementById('status-label');
    const hint      = document.getElementById('toggle-hint');
    const wsDot     = document.getElementById('ws-dot');
    const widget    = document.getElementById('widget');
    const feed      = document.getElementById('chat-feed');
    const emptyMsg  = document.getElementById('chat-empty');
    const msgEl     = document.getElementById('msg-count');
    const uptimeEl  = document.getElementById('uptime-label');

    function setStatus(state) {
        // state: 'connecting' | 'online' | 'offline'
        dot.className = 'dot ' + (state === 'online' ? 'online' : state === 'connecting' ? 'connecting' : '');
        label.className = 'status-label ' + (state === 'online' ? 'online' : state === 'connecting' ? 'connecting' : '');
        if (state === 'online') {
            label.textContent = 'Бот в чате';
            widget.classList.add('active');
            toggle.checked = true;
            hint.textContent = 'вкл';
            if (!connectedAt) {
                connectedAt = Date.now();
                startUptime();
            }
        } else if (state === 'connecting') {
            label.textContent = 'Подключение...';
            widget.classList.remove('active');
            toggle.checked = false;
            hint.textContent = 'вкл';
        } else {
            label.textContent = 'Выключен';
            widget.classList.remove('active');
            toggle.checked = false;
            hint.textContent = 'выкл';
            connectedAt = null;
            clearInterval(uptimeTimer);
            uptimeEl.textContent = '—';
        }
    }

    function startUptime() {
        clearInterval(uptimeTimer);
        uptimeTimer = setInterval(() => {
            if (!connectedAt) return;
            const s = Math.floor((Date.now() - connectedAt) / 1000);
            if (s < 60) uptimeEl.textContent = s + 'с';
            else if (s < 3600) uptimeEl.textContent = Math.floor(s/60) + 'м';
            else uptimeEl.textContent = Math.floor(s/3600) + 'ч';
        }, 1000);
    }

    function addMsg(user, text) {
        emptyMsg && (emptyMsg.style.display = 'none');
        msgCount++;
        msgEl.textContent = msgCount;

        const el = document.createElement('div');
        el.className = 'chat-msg';
        el.innerHTML = `<span class="nick">${escHtml(user)}:</span>${escHtml(text)}`;
        feed.appendChild(el);

        // keep last 50 messages
        while (feed.children.length > 51) feed.removeChild(feed.children[1]);
        feed.scrollTop = feed.scrollHeight;
    }

    function escHtml(s) {
        return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    // Fetch initial status
    fetch(`${BACKEND_URL}/api/status/${CHANNEL}`)
        .then(r => r.json())
        .then(data => { 
            if (data.active) {
                setStatus('online');
            } else {
                setStatus('offline');
            }
        })
        .catch(() => {});

    // Connect socket
    const socket = io(BACKEND_URL, {
        transports: ['websocket', 'polling'],
        reconnectionAttempts: Infinity,
        reconnectionDelay: 2000,
    });

    socket.on('connect', () => {
        wsDot.classList.add('connected');
        toggle.disabled = false;
        socket.emit('widget_join', { channel: CHANNEL });
    });

    socket.on('disconnect', () => {
        wsDot.classList.remove('connected');
        toggle.disabled = true;
        setStatus('connecting');
    });

    socket.on('bot_status_changed', (data) => {
        if (data.channel !== CHANNEL) return;
        console.log(`📢 Статус бота изменился: ${data.active ? 'онлайн' : 'офлайн'}`);
        setStatus(data.active ? 'online' : 'offline');
        isTogglingBot = false; // ✅ НОВОЕ: сбрасываем флаг после получения подтверждения
    });

    socket.on('chatMessage', (data) => {
        if (data.channel !== CHANNEL) return;
        addMsg(data.user, data.message);
    });

    socket.on('widget_state', (data) => {
        if (data.channel !== CHANNEL) return;
        setStatus(data.active ? 'online' : 'offline');
    });

    // Toggle handler
    toggle.addEventListener('change', () => {
        // ✅ НОВОЕ: защита от множественных событий
        if (isTogglingBot) {
            console.warn('⚠️ Toggle уже обрабатывается, ждём ответа сервера');
            return;
        }

        const active = toggle.checked;
        console.log(`🔄 Отправляю команду: бот ${active ? 'вкл' : 'выкл'}`);
        
        isTogglingBot = true;
        hint.textContent = active ? 'вкл' : 'выкл';
        setStatus(active ? 'connecting' : 'offline');
        
        socket.emit('widget_set_bot', { channel: CHANNEL, active });
    });
}
</script>
</body>
