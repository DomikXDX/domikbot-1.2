function setupSocket() {
    try {
        console.log('🔄 Подключение к серверу:', BACKEND_URL);
        socket = io(BACKEND_URL, {
            transports: ['websocket', 'polling'],
            reconnectionAttempts: 5,
            reconnectionDelay: 1000
        });

        socket.on('connect', () => {
            console.log('✅ WebSocket подключен');
            // При подключении отправляем auth, если есть токен
            const token = localStorage.getItem('domik_bot_token');
            if (token && currentUser) {
                socket.emit('auth', { channel: currentUser, token });
                socket.emit('set_bot_status', { channel: currentUser, active: true });
            }
        });

        socket.on('connect_error', (err) => {
            console.error('❌ Ошибка подключения к серверу:', err.message);
            // Показать ошибку пользователю
            alert('Не удалось подключиться к серверу. Проверьте, запущен ли сервер.');
        });

        socket.on('disconnect', () => {
            console.warn('⚠️ WebSocket отключился');
        });

}
